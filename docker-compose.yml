# 로컬 개발 환경 전체 실행: docker compose up --build
# - api       http://localhost:8000/docs  (Swagger)
# - postgres  localhost:5432
# - redis     localhost:6379
# - seaweedfs localhost:8333 (S3 API)
# - flower    http://localhost:5555  (선택: docker compose --profile monitor up)

services:
  api:
    build:
      context: .
      target: api
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    # worker 이미지는 CPU 전용이다. 워커 하나가 gpu 큐(기타 분리)까지 CPU로 함께 처리한다
    command: celery -A app.core.celery_app worker -Q cpu,gpu --loglevel=info --concurrency=1
    env_file: .env
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - model-cache:/models   # AI 모델 가중치 (scripts/download_models.py)
    depends_on:
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone}
      POSTGRES_DB: ${POSTGRES_DB:-capstone}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstone}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: "server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json"
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  flower:
    image: mher/flower:2.0
    profiles: ["monitor"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

volumes:
  postgres-data:
  seaweedfs-data:
  model-cache:
