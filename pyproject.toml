[project]
name = "capstone-backend"
version = "0.1.0"
description = "음원 기반 악기 분리·타브 생성 및 카피 보조 웹서비스 백엔드"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "httpx>=0.27",
    "boto3-stubs[s3]>=1.34",
    "celery-types>=0.22",
]
# AI 파이프라인 의존성(PyTorch, audio-separator 등)은 모델이 확정되면 별도 그룹으로 추가합니다.
# 예) uv add --group ai torch torchaudio

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = [
    "B008",   # FastAPI Depends() 기본값 패턴 허용
    "N818",   # BusinessException 이름 유지 (노션 컨벤션)
    "UP046",  # Pydantic 제네릭 모델은 Generic[T] 방식 유지
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
